name: 🐍 Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#BF5AF2&color_dots=#161b22,#0a3069,#0a5fb4,#0A84FF,#64D2FF
            dist/snake-light.svg?color_snake=#AF52DE&color_dots=#ebedf0,#cfe3ff,#8ec1ff,#3d9bff,#007AFF

      # pushes the SVGs to a separate "output" branch so main stays clean
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
