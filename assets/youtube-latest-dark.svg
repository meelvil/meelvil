<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Latest YouTube upload: Your newest video will appear right here">
  <title>Latest upload — Your newest video will appear right here</title>
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset=".5" stop-color="#BF5AF2"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
    <clipPath id="thumb"><rect x="20" y="20" width="356" height="200" rx="16"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <style>
    .up { opacity:0; animation: up .9s cubic-bezier(.25,.1,.25,1) forwards; }
    .d1 { animation-delay:.12s } .d2 { animation-delay:.24s } .d3 { animation-delay:.36s }
    @keyframes up { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    .play { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.08) } }
  </style>

  <g filter="url(#shadow)"><rect x="20" y="20" width="356" height="200" rx="16" fill="#000" fill-opacity=".001"/><rect x="20" y="20" width="356" height="200" fill="url(#ph)" clip-path="url(#thumb)"/></g>
  <rect x="20" y="216" width="356" height="4" fill="#fff" fill-opacity=".3" clip-path="url(#thumb)"/>
  <rect x="20" y="216" width="0" height="4" fill="#FF453A" clip-path="url(#thumb)">
    <animate attributeName="width" values="0;356" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g class="play">
    <circle cx="198.0" cy="120.0" r="30" fill="#fff" fill-opacity=".92"/>
    <polygon points="190.0,108.0 190.0,132.0 211.0,120.0" fill="#FF453A"/>
  </g>

  
  <text class="up" x="420" y="54" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#FF453A">LATEST UPLOAD</text>
  <text class="up d1" x="420" y="104" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="-.4" fill="#f5f5f7"><tspan x="420" dy="0">Your newest video will appear</tspan><tspan x="420" dy="32">right here</tspan></text>
  <text class="up d2" x="420" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#a1a1a6">Updated automatically every 6 hours</text>
  <text class="up d3" x="420" y="206" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2997FF">Watch on YouTube ›</text>
</svg>
