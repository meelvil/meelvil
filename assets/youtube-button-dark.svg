<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" role="img" aria-label="Visit my YouTube channel">
  <title>Visit my YouTube channel</title>
  <defs>
    <clipPath id="pill"><rect x="4" y="6" width="252" height="48" rx="24"/></clipPath>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .in { opacity:0; animation: in .8s cubic-bezier(.25,.1,.25,1) .2s forwards; }
    @keyframes in { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
    .chev { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%,60%,100% { transform:none } 75% { transform: translateX(3px) } }
  </style>
  <g class="in">
    <rect x="4" y="6" width="252" height="48" rx="24" fill="#f5f5f7"/>
    <g clip-path="url(#pill)">
      <rect x="-80" y="6" width="60" height="48" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-80;-80;300" keyTimes="0;.6;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="26" y="20" width="28" height="20" rx="6" fill="#FF0033"/>
    <polygon points="37,25 37,35 45.5,30" fill="#fff"/>
    <text x="66" y="35.5" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="600" letter-spacing="-.2" fill="#1d1d1f">Visit my channel</text>
    <g class="chev"><path d="M212 24.5 L217.5 30 L212 35.5" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
