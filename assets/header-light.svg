<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Melvil. Developer. Video creator. Console modder.">
  <title>Melvil — Developer. Video creator. Console modder.</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="820" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#007AFF"/><stop offset=".35" stop-color="#AF52DE"/>
      <stop offset=".7" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF9500"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;440 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="rb"><stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#007AFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="rp"><stop offset="0" stop-color="#AF52DE"/><stop offset="1" stop-color="#AF52DE" stop-opacity="0"/></radialGradient>
    <radialGradient id="rk"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF2D55" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .up { opacity:0; animation: up 1.1s cubic-bezier(.25,.1,.25,1) forwards; }
    @keyframes up { from { opacity:0; transform: translateY(18px) } to { opacity:1; transform:none } }
    .w { fill-opacity:0; animation: w .9s cubic-bezier(.25,.1,.25,1) forwards; }
    @keyframes w { to { fill-opacity:1 } }
  </style>

  <g opacity=".14">
    <ellipse cx="450" cy="160" rx="230" ry="125" fill="url(#rb)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 -8;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="610" cy="150" rx="240" ry="130" fill="url(#rp)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 8;0 0" dur="12s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="760" cy="160" rx="230" ry="125" fill="url(#rk)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 -8;0 0" dur="16s" repeatCount="indefinite"/></ellipse>
  </g>

  <g text-anchor="middle">
    <text class="up" x="600.0" y="82" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#6e6e73">Hi, I’m</text>
    <text class="up" style="animation-delay:.15s" x="600.0" y="190" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="118" font-weight="700" letter-spacing="-4" fill="url(#g)">Melvil.</text>
    <text x="600.0" y="252" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="-.3">
      <tspan class="w" style="animation-delay:.7s" fill="#1d1d1f">Developer.</tspan>
      <tspan class="w" style="animation-delay:1.1s" fill="#1d1d1f"> Video creator.</tspan>
      <tspan class="w" style="animation-delay:1.5s" fill="#1d1d1f"> Console modder.</tspan>
    </text>
  </g>
</svg>
